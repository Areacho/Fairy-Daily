name: Windows build and offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile and run offline checks
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build.ps1 -Test
      - name: Verify and package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Fairy-Daily-Windows
          path: |
            dist/MiyouDaily-Windows.zip
            dist/SHA256SUMS.txt
            build/high-dpi-report.json
          if-no-files-found: error
